<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>근로고래 이메일 인증</title>
</head>
<body style="margin:0; padding:0; background-color:#F6F8FB; -webkit-text-size-adjust:100%;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F6F8FB; padding:44px 16px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" border="0" style="width:480px; max-width:480px; background-color:#ffffff; border:1px solid #E5E9F0; border-radius:18px;">
          <!-- 헤더: 로고 (근로고래로 이동 — 목업 링크, 실제 도메인 생기면 교체) -->
          <tr>
            <td align="center" style="padding:40px 36px 6px 36px;">
              <a href="https://geunrogorae.com" target="_blank" style="text-decoration:none; font-size:30px; font-weight:800; color:#1F75DD; letter-spacing:-0.5px;">근로고래</a>
            </td>
          </tr>
          <!-- 제목 + 안내 -->
          <tr>
            <td align="center" style="padding:14px 36px 0 36px;">
              <div style="font-size:24px; font-weight:700; color:#272932;">이메일 인증 코드</div>
              <div style="font-size:16px; color:#5B5D67; line-height:1.7; margin-top:12px;">
아래 6자리 코드를 입력해<br>회원가입을 완료해주세요.
              </div>
            </td>
          </tr>
          <!-- 인증 코드 박스 (기본 굵은 sans 폰트, 크게) -->
          <tr>
            <td align="center" style="padding:30px 36px 8px 36px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" style="background-color:#EAF3FE; border:1px solid #B7D6FA; border-radius:14px; padding:22px 30px;">
                    <span style="font-size:52px; font-weight:800; letter-spacing:8px; color:#143F77; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif; word-break:break-all; padding-left:8px;">{{ .Token }}</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- 만료 안내 -->
          <tr>
            <td align="center" style="padding:6px 36px 8px 36px;">
              <div style="font-size:14px; color:#9598A0; line-height:1.7;">
                이 코드는 <strong style="color:#5B5D67;">5분</strong> 후 만료됩니다.<br>
                본인이 요청하지 않았다면 이 메일을 무시하세요.
              </div>
            </td>
          </tr>
          <!-- 구분선 -->
          <tr>
            <td style="padding:26px 36px 0 36px;">
              <div style="border-top:1px solid #EEF1F6; font-size:0; line-height:0;">&nbsp;</div>
            </td>
          </tr>
          <!-- 푸터 -->
          <tr>
            <td align="center" style="padding:18px 36px 36px 36px;">
              <a href="https://geunrogorae.com" target="_blank" style="text-decoration:none; font-size:13px; color:#9598A0;">근로장학생을 위한 근무지 리뷰 · 근로고래</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
