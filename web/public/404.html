<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>페이지를 찾을 수 없어요 | 근로고래</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 24px;
        color: #272932;
        background: #f6f8fb;
        font-family: Pretendard, -apple-system, BlinkMacSystemFont, system-ui,
          "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      }
      main {
        width: min(100%, 520px);
        padding: 48px 32px;
        text-align: center;
        background: #fff;
        border: 1px solid #e1e5eb;
        border-radius: 8px;
        box-shadow: 0 4px 12px rgba(39, 41, 50, 0.09);
      }
      .code {
        margin-bottom: 10px;
        color: #4392f1;
        font-size: 54px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.04em;
      }
      h1 { margin: 0; font-size: 24px; line-height: 1.35; }
      p { margin: 12px 0 28px; color: #6f737d; font-size: 15px; line-height: 1.6; }
      a {
        display: inline-block;
        min-width: 140px;
        padding: 10px 18px;
        color: #fff;
        background: #4392f1;
        border: 1px solid #4392f1;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible { outline: 3px solid #b7d6fa; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <div class="code" aria-hidden="true">404</div>
      <h1>페이지를 찾을 수 없어요</h1>
      <p>주소가 잘못되었거나, 이동 또는 삭제된 페이지예요.</p>
      <a href="/home">홈으로 돌아가기</a>
    </main>
  </body>
</html>
